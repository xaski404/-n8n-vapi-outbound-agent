# Production stack for Hetzner VPS — n8n + Cloudflare Named Tunnel only.
# Usage on server: docker compose up -d

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      - TZ=Europe/Warsaw
      - GENERIC_TIMEZONE=Europe/Warsaw
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_RUNNERS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENVIRONMENT_VARIABLES_ALLOW_LIST=RETELL_API_KEY,RETELL_AGENT_ID,RETELL_INBOUND_AGENT_ID,RETELL_OUTBOUND_AGENT_ID,RETELL_FROM_NUMBER,WEBHOOK_URL,PUBLIC_WEBHOOK_URL,GOOGLE_SHEETS_DOCUMENT_ID,GOOGLE_SHEETS_SHEET_NAME,GOOGLE_CALENDAR_ID,STUDIO_TIMEZONE,STUDIO_OPEN_HOUR,STUDIO_CLOSE_HOUR,STUDIO_WORK_DAYS,BOOKING_DURATION_MINUTES
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=72
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=200
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=1
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    depends_on:
      - n8n

volumes:
  n8n_data:
